<h1>Billing History</h1>

<div class="billing-table-card">
  <table class="billing-table">
    <thead>
      <tr>
        <th>Issue Date</th>
        <th>Amount Due</th>
        <th>Due Date</th>
        <th>Paid</th>
        <th>Download</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let item of billingHistory">
        <td>{{ item.issueDate | date:'dd MMM yyyy' }}</td>
        <td>£{{ item.amountDue }}</td>
        <td>{{ item.dueDate | date:'dd MMM yyyy' }}</td>

        <td>
          <span
            class="paid"
            [class.paid--yes]="item.paid"
            [class.paid--no]="!item.paid">
            {{ item.paid ? 'Yes' : 'No' }}
          </span>
        </td>

        <td>
          <button
            class="btn-download"
            (click)="downloadPdf(item.pdfUrl)">
            PDF
          </button>
        </td>
      </tr>

      <!-- Optional: show message if no billing history -->
      <tr *ngIf="billingHistory.length === 0">
        <td colspan="5" class="empty-state">
          No billing history available.
        </td>
      </tr>
    </tbody>
  </table>
</div>
