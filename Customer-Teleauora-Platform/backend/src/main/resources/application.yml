
spring:
  application:
    name: teleauora-portal
  datasource:
    url: jdbc:postgresql://localhost:5432/teleauora
    username: teleauora
    password: telepass
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: always
      continue-on-error: true

server:
  port: 8080

# Resource server (JWT). For local dev, you can disable by allowing all requests or use a mock.
# Example (B2C/External ID):
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri: https://<tenant>.b2clogin.com/<TENANT_GUID>/discovery/v2.0/keys?p=<USER_FLOW>

storage:
  account-name: YOUR_STORAGE_ACCOUNT_NAME
  bills-container: bills
